name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # "tools" no longer exists in recent SDK repos and makes sdkmanager fail
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk ScreenTranslate-${{ github.ref_name }}-debug.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslate-${{ github.ref_name }}-debug
          path: ScreenTranslate-*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ScreenTranslate ${{ github.ref_name }}
          body: |
            ### Installation

            1. Download and install the APK.
            2. Open the app and grant, in order:
               - Accessibility service permission
               - Overlay permission
               - Notification permission
            3. Pick a translation engine (Settings -> Translation engine). The
               Bilibili, web and Google offline engines need no configuration.
            4. For OCR, tap "Enable screen capture" on the home screen.

            > This is a debug APK signed with the Android debug certificate, so it
            > installs directly. For a release-signed build, configure signing and
            > run `./gradlew assembleRelease`.
          files: ScreenTranslate-*.apk
          draft: false
          prerelease: false
